name: Bug report
description: Something is broken or looks wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: desktop
    attributes:
      label: OS, desktop and version
      placeholder: Windows 11 23H2, or Omarchy 4 (Hyprland), or Fedora 41 GNOME
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Blobble version
      placeholder: 0.1.2 (Settings > About)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or screenshot
      description: On Linux, run `blobble` from a terminal and paste what it prints.
      render: shell
