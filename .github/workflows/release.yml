name: Release

# Push a tag like v0.1.0 to build the Windows installer and the Linux packages
# and attach them to a draft release. Publish the draft when they look right.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: The tag matches the app's version
        shell: bash
        run: |
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $v in tauri.conf.json"; exit 1
          fi

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci
        working-directory: desktop

      - name: Build (Windows installer)
        if: runner.os == 'Windows'
        run: npm run build
        working-directory: desktop

      - name: Build (Linux packages)
        if: runner.os == 'Linux'
        run: npm run build:linux
        working-directory: desktop

      - name: Collect
        shell: bash
        run: |
          mkdir out
          b=desktop/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The README links to this exact name.
            cp "$b"/nsis/*-setup.exe out/Blobble_x64-setup.exe
          else
            cp "$b"/deb/*.deb "$b"/rpm/*.rpm "$b"/appimage/*.AppImage out/
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: blobble-${{ runner.os }}
          path: out/*

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Blobble ${GITHUB_REF_NAME#v}"
